# Local development PostgreSQL only. Change credentials for any other environment.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: networx
      POSTGRES_USER: networx
      POSTGRES_PASSWORD: networx_local_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - networx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networx -d networx"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  networx-postgres-data:
